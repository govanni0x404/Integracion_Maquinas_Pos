# nginx delante de ApiPago: recibe HTTPS desde internet y se lo pasa a la API,
# que solo escucha en 127.0.0.1:5005.
# 1. Cambiar pagos.midominio.cl por el dominio real (2 lugares).
# 2. Copiar a /etc/nginx/sites-available/apipago y activarlo (ver LEEME.md).
# 3. El certificado HTTPS lo pone certbot (sudo certbot --nginx -d pagos.midominio.cl).

server {
    listen 80;
    server_name pagos.midominio.cl;

    # El panel (configurar .env, resolver ventas, reiniciar) NUNCA se publica a
    # internet: se entra por túnel SSH (ver LEEME.md).
    location /panel {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:5005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Un /pago queda abierto mientras el cliente paga (minutos): no cortarlo.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
    }
}
